<script>
(async function () {
  const CV_URL = "/open-cv.json";

  function levelLabel(level) {
    const map = {
      native:       "nativo",
      fluent:       "fluente",
      full_professional: "full professional",
      professional: "professional",
      advanced:     "avançado",
      intermediate: "intermediário",
    };
    return map[level] || level;
  }

  function populateSidebar(profile) {
    const { name, title, location, links } = profile;
    document.getElementById("sidebar-name").textContent     = name;
    document.getElementById("sidebar-subtitle").textContent = `${title} • ${location}`;

    const emailEl = document.getElementById("sidebar-email");
    emailEl.textContent = links.email;
    emailEl.href = `mailto:${links.email}`;

    const linkedinEl = document.getElementById("sidebar-linkedin");
    linkedinEl.textContent = links.linkedin.replace("https://linkedin.com", "");
    linkedinEl.href = links.linkedin;

    const githubEl = document.getElementById("sidebar-github");
    githubEl.textContent = links.github.replace("https://github.com", "");
    githubEl.href = links.github;
  }

  function populateSobre(cv) {
    const { profile, skills, languages } = cv;

    // Bio
    document.getElementById("bio-main").textContent =
      profile.bio || "Software engineer com mais de oito anos de experiência focada em apps mobile.";
    document.getElementById("bio-interests").textContent =
      profile.interests || "Interesses: Design Patterns, Concurrency e Code Architecture.";

    // Strengths
    const strengthsEl = document.getElementById("strengths");
    if (Array.isArray(profile.strengths) && profile.strengths.length) {
      strengthsEl.textContent = profile.strengths.join(", ") + ".";
    } else {
      strengthsEl.textContent =
        "UI complexa, search/filter/sort client-side, notificações, deep links, caching e componentes custom.";
    }

    // Spoken languages
    const langText = languages
      .map(l => `${l.language}: ${levelLabel(l.level)}`)
      .join(" • ");
    document.getElementById("spoken-languages").textContent = langText || "—";

    // Skills block
    const skillsEl = document.getElementById("skills-block");
    const rows = [
      { label: "linguagens", values: skills.languages },
      { label: "plataformas", values: skills.platforms },
      { label: "arquitetura", values: skills.architecture },
      { label: "ferramentas", values: skills.tools },
      { label: "práticas",    values: skills.practices },
    ];
    skillsEl.innerHTML = rows.map(r =>
      `<p style="margin:4px 0;font-size:13px;">
        <span style="color:var(--muted);min-width:90px;display:inline-block;">${r.label}</span>
        ${r.values.join(" • ")}
      </p>`
    ).join("");

    // Contact
    const { links } = profile;
    document.getElementById("contact-block").innerHTML =
      `email: <a href="mailto:${links.email}">${links.email}</a><br/>
       linkedin: <a href="${links.linkedin}" rel="noreferrer">${links.linkedin}</a><br/>
       github: <a href="${links.github}" rel="noreferrer">${links.github}</a>`;

    // Footer stack
    const stackStr = [...skills.languages, ...skills.platforms].join(" • ");
    document.getElementById("footer-stack").textContent = `stack: ${stackStr}`;
  }

  try {
    const res = await fetch(CV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const cv  = await res.json();
    populateSidebar(cv.profile);
    populateSobre(cv);
  } catch (err) {
    console.error("[open-cv] falha ao carregar:", err);
  }
})();
</script>
